    if (s.kind === 'img') h.push('<img src="' + esc(s.src) + '" alt="" class="slideImg"' + (i ? ' loading="lazy"' : '') + '>');
    else h.push('<button type="button" class="heroPlay" data-video="' + esc(s.url) + '" aria-label="' + esc(u.tabs[1]) + '"><img src="' + esc(s.cover) + '" alt="" loading="lazy"><span class="vplay">' + ICON.play + '</span></button>');
    h.push('</div>');
  });
  h.push('</div>');
  h.push('<button type="button" class="round back" id="backBtn" aria-label="' + esc(u.back) + '">' + ICON.back + '</button>');
  h.push('<div class="langs" role="group" aria-label="' + esc(u.lang) + '">');
  [['en', 'EN'], ['zh', '中文'], ['ms', 'BM']].forEach(function (p) { h.push('<button type="button" class="langBtn' + (lg === p[0] ? ' langOn' : '') + '" data-lang="' + p[0] + '" aria-pressed="' + (lg === p[0]) + '">' + p[1] + '</button>'); });
  h.push('</div>');
  h.push('<div class="topRight"><button type="button" class="roundStatic" id="shareBtn" aria-label="' + esc(u.share) + '">' + ICON.share + '</button></div>');
  if (sl.length > 1) h.push('<span class="counter" id="counter">' + (S.slide + 1) + '/' + sl.length + '</span>');
  h.push('</div>');
  if (sl.length > 1) {
    h.push('<div class="thumbs">');
    sl.forEach(function (s, i) { h.push('<button type="button" class="thumb' + (i === S.slide ? ' thumbOn' : '') + '" data-go="' + i + '" aria-label="' + (i + 1) + '"><img src="' + esc(s.kind === 'img' ? s.src : s.cover) + '" alt="" loading="lazy"></button>'); });
    h.push('</div>');
  }
  // price + name
  h.push('<div class="info"><div class="priceRow"><span class="price"><small>RM</small>' + D.priceFrom + '<em>' + esc(u.from) + '</em><s class="rp">' + esc(u.rp.replace('{rp}', D.rp)) + '</s></span><span class="groupTag">' + esc(D.group) + '</span></div>');
  h.push('<h1 class="title">' + esc(t(D.title)) + '</h1><p class="summary">' + esc(t(D.summary)) + '</p>');
  h.push('<div class="tags">' + u.tags.map(function (x) { return '<span class="tag">' + ICON.spark + esc(x) + '</span>'; }).join('') + '</div></div>');
  // package row
  h.push('<button type="button" class="pickRow" id="pickRow"><span class="pickKey">' + esc(pick ? u.chosen : u.choose) + '</span><span class="pickVal">' + esc(pick ? u.trial + ' · ' + pick.label + (S.qty > 1 ? ' × ' + S.qty : '') : u.packages.replace('{n}', D.packages.length)) + '</span>' + ICON.caret + '</button>');
  // tabs
  h.push('<div class="tabs" role="tablist">' + u.tabs.map(function (x, i) { return '<button type="button" role="tab" aria-selected="' + (S.tab === i) + '" class="tab' + (S.tab === i ? ' tabOn' : '') + '" data-tab="' + i + '">' + esc(x) + '</button>'; }).join('') + '</div>');
  if (S.tab === 0) {
    h.push('<div class="wrap" lang="' + (lg === 'zh' ? 'zh-Hans' : lg) + '">');
    var n = topics();
    a.forEach(function (p, i) {
      h.push('<section class="artPage">');
      if (p.topic) h.push('<div class="topicBar" id="ch-' + p.topic.n + '"><span class="topicNo">' + p.topic.n + '</span><span class="topicText"><small>' + esc(u.topic + p.topic.n + u.of + n) + '</small>' + esc(t(p.topic.name)) + '</span></div>');
      if (p.video) h.push('<video src="' + esc(p.video) + '" poster="' + esc(p.img) + '" class="artImg" autoplay muted loop playsinline preload="metadata" aria-label="' + esc(p.alt) + '"></video>');
      else h.push('<button type="button" class="artTap" data-zoom="' + i + '" aria-label="' + esc(p.alt) + '"><img src="' + esc(p.img) + '" alt="' + esc(p.alt) + '" class="artImg" width="1086" height="1448"' + (i < 2 ? '' : ' loading="lazy"') + '></button>');
      if (p.disclaimer) h.push('<p class="disclaimer">' + esc(t(p.disclaimer)) + '</p>');
      if (p.ctas && p.ctas.length) {
        h.push('<div class="artCtas">');
        p.ctas.forEach(function (c) {
          if (c.kind === 'whatsapp') h.push('<a href="' + esc(c.href) + '" target="_blank" rel="noreferrer" class="artBtn artWa">' + ICON.wa + esc(t(c.label)) + '</a>');
          else h.push('<button type="button" class="artBtn assessBtn">' + esc(t(c.label)) + ICON.arrow + '</button>');
        });
        h.push('</div>');
      }
      h.push('</section>');
    });
    h.push('</div>');
  } else if (S.tab === 1) {
    if (D.videos.length) {
      h.push('<div class="videos"><div class="vgrid">');
      D.videos.forEach(function (v) { h.push('<button type="button" class="vcard" data-video="' + esc(v) + '" aria-label="' + esc(u.watch + ': ' + t(D.title)) + '"><img src="videos/tt-' + ttId(v) + '.jpg" alt="" class="vcover" loading="lazy"><span class="vlogo">' + ICON.tt + esc(ttHandle(v)) + '</span><span class="vplay">' + ICON.play + '</span><span></span></button>'); });
      h.push('</div></div>');
    } else h.push('<div class="soon"><b>' + esc(u.soon) + '</b></div>');
  } else {
    h.push('<div class="stories">');
    D.clips.forEach(function (c) { h.push('<figure class="clip"><video src="' + esc(c.src) + '" poster="' + esc(c.poster) + '" autoplay muted loop playsinline preload="metadata" class="clipVideo" aria-label="' + esc(t(c.label)) + '"></video><figcaption class="clipLabel">' + esc(t(c.label)) + '</figcaption></figure>'); });
    h.push('</div>');
  }
  $('shell').innerHTML = h.join('');
  // bottom bar
  $('bar').innerHTML = '<a href="https://wa.me/' + D.wa + '" target="_blank" rel="noreferrer" class="barIcon">' + ICON.wa + '<span>' + esc(u.chat) + '</span></a><button type="button" class="buyBtn" id="buyBtn">' + esc(u.buy) + '</button>';
  // sheet
  var sh = $('sheetHost');
  if (S.sheet) {
    var th = thumb(), s = [];
    s.push('<div class="sheetBack" id="sheetBack"><div class="sheet" role="dialog" aria-label="' + esc(u.choose) + '">');
    s.push('<button type="button" class="sheetClose" id="sheetClose" aria-label="' + esc(u.close) + '">' + ICON.x + '</button>');
    s.push('<div class="sheetHead"><span class="sheetPic"><img src="' + esc(th) + '" alt=""><span class="trtTag">' + esc(u.trt) + '</span></span><span class="sheetPrice">' + (pick ? '<small>RM</small>' + pick.price : '<small>RM</small>' + D.priceFrom + '<em>' + esc(u.from) + '</em>') + '</span></div>');
    s.push('<div class="sheetTitle">' + esc(u.allPkgs.replace('{n}', D.packages.length)) + '</div><div class="choiceList">');
    D.packages.forEach(function (p) {
      s.push('<button type="button" class="choice' + (S.pick === p.code ? ' choiceOn' : '') + '" data-pick="' + esc(p.code) + '" aria-pressed="' + (S.pick === p.code) + '"><span class="choicePic"><img src="' + esc(th) + '" alt=""><span class="trtTag">' + esc(u.trt) + '</span></span><span class="choiceMain"><span class="choiceLabel">' + esc(u.trial + ' · ' + p.label) + '</span></span><span class="choicePrice">' + esc(rm(p.price)) + '</span></button>');
    });
    s.push('</div><div class="qtyRow"><span>' + esc(u.qty) + '</span><span class="qty"><button type="button" id="qMinus" aria-label="-">−</button><b>' + S.qty + '</b><button type="button" id="qPlus" aria-label="+">+</button></span></div>');
    s.push('<button type="button" class="buyWide" id="buyWide"' + (pick ? '' : ' disabled') + '>' + esc(u.buy) + '</button></div></div>');
    sh.innerHTML = s.join('');
  } else sh.innerHTML = '';
  // zoom
  var z = $('zoomHost');
  if (S.zoom !== null && a[S.zoom]) {
    var zp = a[S.zoom];
    z.innerHTML = '<div class="zoomBack" id="zoomBack" role="dialog" aria-label="' + esc(zp.alt) + '"><img src="' + esc(zp.img) + '" alt="' + esc(zp.alt) + '" class="zoomImg"><div class="zoomBar"><button type="button" class="zoomBtn" id="zoomShare">' + ICON.share + esc(u.share) + '</button><button type="button" class="zoomBtn" id="zoomClose" aria-label="' + esc(u.close) + '">' + ICON.x + '</button></div></div>';
  } else z.innerHTML = '';
  // video overlay
  var v = $('videoHost');
  if (S.video) v.innerHTML = '<div class="vback" id="vback" role="dialog" aria-label="' + esc(t(D.title)) + '"><iframe src="' + esc(tiktokSrc(S.video)) + '" title="' + esc(t(D.title)) + '" class="vframeTall" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write; web-share" allowfullscreen></iframe><button type="button" class="zoomBtn" id="vClose" aria-label="' + esc(u.close) + '">' + ICON.x + '</button></div>';
  else v.innerHTML = '';
  var tr = $('track');
  if (tr) { tr.scrollLeft = S.slide * tr.clientWidth; }
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('button, a, .sheetBack, .zoomBack, .vback');
  if (!el) return;
  var d = el.dataset || {};
  if (el.id === 'backBtn') return goBack();
  if (el.id === 'shareBtn') return share();
  if (d.lang) return setLang(d.lang);
  if (d.go !== undefined) { S.slide = +d.go; var tr = $('track'); if (tr) tr.scrollTo({ left: S.slide * tr.clientWidth, behavior: 'smooth' }); return; }
  if (d.tab !== undefined) { S.tab = +d.tab; render(); return; }
  if (d.video) { S.video = d.video; render(); return; }
  if (d.zoom !== undefined) { S.zoom = +d.zoom; render(); return; }
  if (el.classList.contains('assessBtn')) return tryAssess();
  if (el.id === 'pickRow' || el.id === 'buyBtn') { S.sheet = el.id === 'buyBtn' ? 'buy' : 'pick'; render(); return; }
  if (el.id === 'sheetClose' || (el.id === 'sheetBack' && e.target === el)) { S.sheet = null; render(); return; }
  if (d.pick) { S.pick = d.pick; render(); return; }
  if (el.id === 'qMinus') { S.qty = Math.max(1, S.qty - 1); render(); return; }
  if (el.id === 'qPlus') { S.qty += 1; render(); return; }
  if (el.id === 'buyWide') return waBook();
  if (el.id === 'zoomClose' || (el.id === 'zoomBack' && e.target === el)) { S.zoom = null; render(); return; }
  if (el.id === 'zoomShare') { var zp = art()[S.zoom]; if (zp) sharePic(zp.img, zp.alt); return; }
  if (el.id === 'vClose' || (el.id === 'vback' && e.target === el)) { S.video = null; render(); return; }
});
document.addEventListener('scroll', function (e) {
  var tr = e.target && e.target.id === 'track' ? e.target : null;
  if (!tr) return;
  var i = Math.round(tr.scrollLeft / tr.clientWidth);
  if (i !== S.slide) { S.slide = i; var c = $('counter'); if (c) c.textContent = (i + 1) + '/' + slides().length; var th = document.querySelectorAll('.thumb'); th.forEach(function (b, j) { b.classList.toggle('thumbOn', j === i); }); }
}, true);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (S.video) S.video = null; else if (S.zoom !== null) S.zoom = null; else if (S.sheet) S.sheet = null; else return; render(); } });
setLang(lg);
})();</script>
</body>
</html>
